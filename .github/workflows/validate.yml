# This workflow is managed by gh actions-lock.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify | hassfest
        uses: home-assistant/actions/hassfest@2026.11.0

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify | HACS
        uses: hacs/action@22.5.0
        with:
          category: integration
          # No brand images are shipped.
          ignore: brands
