name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-node@v7
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: node --check custom_components/location_timeline/frontend/location-timeline-panel.js
